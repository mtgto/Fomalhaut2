name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/cache@v6.1.0
        id: cache
        with:
          path: .build
          key: ${{ runner.os }}-spm-${{ hashFiles('Fomalhaut2.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-
      - name: resolve packages
        run: xcodebuild -resolvePackageDependencies -clonedSourcePackagesDirPath .build
        if: steps.cache.outputs.cache-hit != 'true'
      - name: test
        run: |
          cp Fomalhaut2Tests/fixture/empty.zip Fomalhaut2/assets.zip
          # Sign ad-hoc without a team so that no certificate or provisioning profile is required
          set -o pipefail && xcodebuild -target Fomalhaut2Tests -scheme Fomalhaut2 -clonedSourcePackagesDirPath .build \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= \
            clean test | xcpretty
